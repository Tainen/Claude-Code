<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小林bot</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg-sub: #f7f7f6; --text: #16181d; --muted: #6f7480;
    --black: #16181d; --accent: #ea580c; --accent-soft: #fff3ea; --border: #e6e6e3; --danger: #c0392b;
  }
  body { font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.7; height: 100dvh; display: flex; flex-direction: column; }
  header { background: var(--black); color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 18px; } header h1 span { color: var(--accent); }
  header .sub { font-size: 12px; color: #c9ccd3; flex: 1; min-width: 200px; }
  header button { background: transparent; color: #fff; border: 1px solid #555; border-radius: 6px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
  .modes { display: flex; gap: 8px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg-sub); flex-wrap: wrap; }
  .modes label { cursor: pointer; border: 1px solid var(--border); background: #fff; border-radius: 999px; padding: 4px 14px; font-size: 14px; }
  .modes input { display: none; }
  .modes input:checked + span { color: var(--accent); font-weight: bold; }
  .modes label:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
  .hint { font-size: 12px; color: var(--muted); padding: 6px 16px 0; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 860px; width: 100%; margin: 0 auto; }
  .msg .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .msg .body { border-radius: 10px; padding: 10px 14px; overflow-wrap: anywhere; }
  .msg.user .body { background: var(--bg-sub); white-space: pre-wrap; }
  .msg.bot .body { border: 1px solid var(--border); border-left: 4px solid var(--accent); }
  .msg.bot .body h1, .msg.bot .body h2, .msg.bot .body h3 { font-size: 15px; margin: 10px 0 4px; }
  .msg.bot .body ul, .msg.bot .body ol { padding-left: 1.4em; margin: 4px 0; }
  .msg.bot .body p { margin: 4px 0; }
  .msg.bot .body table { border-collapse: collapse; margin: 6px 0; font-size: 14px; display: block; overflow-x: auto; }
  .msg.bot .body td, .msg.bot .body th { border: 1px solid var(--border); padding: 4px 8px; vertical-align: top; }
  .msg.bot .body code { background: var(--bg-sub); padding: 0 4px; border-radius: 4px; }
  .msg.error .body { color: var(--danger); border: 1px solid var(--danger); }
  .files { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .empty { margin: auto; text-align: center; color: var(--muted); max-width: 520px; font-size: 14px; }
  .empty b { color: var(--text); }
  form { border-top: 1px solid var(--border); padding: 10px 16px; display: flex; flex-direction: column; gap: 6px; max-width: 892px; width: 100%; margin: 0 auto; }
  textarea { width: 100%; min-height: 80px; max-height: 40vh; resize: vertical; padding: 10px; font: inherit; border: 1px solid var(--border); border-radius: 8px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row .chips { flex: 1; font-size: 12px; color: var(--muted); }
  .chip { display: inline-block; background: var(--bg-sub); border-radius: 999px; padding: 1px 8px; margin: 2px; }
  .chip button { border: none; background: none; cursor: pointer; color: var(--muted); }
  .btn { border: 1px solid var(--border); background: #fff; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-size: 14px; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: bold; }
  .btn:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
<header>
  <h1>小林<span>bot</span></h1>
  <div class="sub">小林さんに出す前に、まずここで指摘をつぶす。※過去の会議文字起こしから作った分身です。最終判断は必ず本人に。</div>
  <button id="reset" type="button">新しい会話</button>
</header>
<div class="modes" id="modes"></div>
<div class="hint" id="hint"></div>
<div id="log"><div class="empty" id="empty">
  <p><b>使い方</b></p>
  <p>企画書・提案資料・メール文面・HP案・商談準備メモなどを貼り付けるか、PDF/画像/テキストを添付して送信。<br>
  「何のための資料か」「誰に出すか」「いつまでか」を一言添えると精度が上がります。</p>
</div></div>
<form id="form">
  <textarea id="input" placeholder="例）来週の○○社 二次商談用の提案資料です。決裁者は社長。見てください。（Ctrl+Enter で送信）"></textarea>
  <div class="row">
    <label class="btn">📎 添付<input id="file" type="file" multiple hidden accept=".pdf,.png,.jpg,.jpeg,.gif,.webp,.txt,.md,.csv"></label>
    <div class="chips" id="chips"></div>
    <button class="btn primary" id="send" type="submit">送信</button>
  </div>
</form>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const history = [];      // {role, text, files}
let pending = [];        // 添付待ち
let password = '';
let busy = false;

function md(text) {
  try { return DOMPurify.sanitize(marked.parse(text)); }
  catch { const d = document.createElement('div'); d.textContent = text; return d.innerHTML; }
}

function addMsg(kind, text, files) {
  $('empty')?.remove();
  const el = document.createElement('div');
  el.className = `msg ${kind}`;
  el.innerHTML = `<div class="who">${kind === 'user' ? 'あなた' : kind === 'bot' ? '小林bot' : 'エラー'}</div><div class="body"></div>`;
  const body = el.querySelector('.body');
  if (kind === 'bot') body.innerHTML = md(text); else body.textContent = text;
  if (files?.length) {
    const f = document.createElement('div'); f.className = 'files';
    f.textContent = '📎 ' + files.map((x) => x.name).join(', ');
    el.appendChild(f);
  }
  $('log').appendChild(el);
  $('log').scrollTop = $('log').scrollHeight;
  return body;
}

async function loadConfig() {
  const cfg = await (await fetch('/api/config')).json();
  if (cfg.passwordRequired) {
    try { password = sessionStorage.getItem('kb-pass') || ''; } catch {}
    if (!password) password = prompt('小林bot のパスワードを入力してください') || '';
  }
  cfg.modes.forEach((m, i) => {
    const l = document.createElement('label');
    l.innerHTML = `<input type="radio" name="mode" value="${m.id}" ${i === 0 ? 'checked' : ''}><span>${m.label}</span>`;
    l.querySelector('input').addEventListener('change', () => { $('hint').textContent = m.hint; });
    $('modes').appendChild(l);
    if (i === 0) $('hint').textContent = m.hint;
  });
}

function renderChips() {
  $('chips').innerHTML = '';
  pending.forEach((f, i) => {
    const c = document.createElement('span'); c.className = 'chip';
    c.textContent = f.name;
    const x = document.createElement('button'); x.type = 'button'; x.textContent = '×';
    x.onclick = () => { pending.splice(i, 1); renderChips(); };
    c.appendChild(x); $('chips').appendChild(c);
  });
}

$('file').addEventListener('change', async (e) => {
  for (const file of e.target.files) {
    if (file.size > 15 * 1024 * 1024) { alert(`${file.name} は大きすぎます（15MBまで）`); continue; }
    const isText = /\.(txt|md|csv)$/i.test(file.name);
    if (isText) {
      pending.push({ name: file.name, kind: 'text', data: await file.text() });
    } else {
      const data = await new Promise((ok, ng) => {
        const r = new FileReader(); r.onload = () => ok(String(r.result).split(',')[1]); r.onerror = ng; r.readAsDataURL(file);
      });
      pending.push({ name: file.name, kind: 'binary', mediaType: file.type || 'application/pdf', data });
    }
  }
  e.target.value = ''; renderChips();
});

$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $('form').requestSubmit(); }
});

$('reset').onclick = () => { if (busy) return; history.length = 0; $('log').innerHTML = ''; pending = []; renderChips(); };

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  if (busy) return;
  const text = $('input').value.trim();
  if (!text && pending.length === 0) return;
  const files = pending; pending = []; renderChips();
  $('input').value = '';
  history.push({ role: 'user', text, files });
  addMsg('user', text || '（添付のみ）', files);

  busy = true; $('send').disabled = true;
  const body = addMsg('bot', '…考え中');
  let answer = '';
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-bot-password': password },
      body: JSON.stringify({ mode: document.querySelector('input[name=mode]:checked').value, messages: history }),
    });
    if (!res.ok) {
      const j = await res.json().catch(() => ({}));
      if (res.status === 401) { try { sessionStorage.removeItem('kb-pass'); } catch {} password = prompt('パスワードが違います。再入力してください') || ''; }
      throw new Error(j.error || `HTTP ${res.status}`);
    }
    try { sessionStorage.setItem('kb-pass', password); } catch {}
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const chunk = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const ev = /^event: (.*)$/m.exec(chunk)?.[1]; const data = JSON.parse(/^data: (.*)$/m.exec(chunk)?.[1] || '{}');
        if (ev === 'delta') { answer += data.text; body.innerHTML = md(answer); $('log').scrollTop = $('log').scrollHeight; }
        if (ev === 'error') throw new Error(data.error);
      }
    }
    history.push({ role: 'assistant', text: answer });
  } catch (err) {
    body.parentElement.remove();
    history.pop(); // 失敗した発言は履歴から外す（再送できるよう入力欄に戻す）
    $('input').value = text; pending = files; renderChips();
    addMsg('error', err.message);
  } finally {
    busy = false; $('send').disabled = false;
  }
});

loadConfig();
</script>
</body>
</html>
